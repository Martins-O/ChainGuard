name: Keep Services Awake

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Server
        run: curl -s -o /dev/null -w "%{http_code}" https://chainguard-api-server.onrender.com/health

      - name: Ping AI Engine
        run: curl -s -o /dev/null -w "%{http_code}" https://chainguard-ai-engine.onrender.com/health

      - name: Ping Alert Service
        run: curl -s -o /dev/null -w "%{http_code}" https://chainguard-alert-service.onrender.com/health
