version: '3.8'

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: chainguard-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chainguard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  mongodb:
    image: mongo:7
    container_name: chainguard-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-chainguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-chainguard_password}
      MONGO_INITDB_DATABASE: chainguard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - chainguard
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/chainguard --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Application Services ─────────────────────────────────────────────────

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: chainguard-ingestion
    environment:
      - REDIS_URL=redis://redis:6379
      - CONFIG_PATH=/app/configs/ingestion.toml
      - RUST_LOG=${LOG_LEVEL:-info}
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs
    networks:
      - chainguard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: chainguard-ai-engine
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://chainguard:chainguard_password@mongodb:27017/chainguard}
      - REDIS_URL=redis://redis:6379
      - THREAT_THRESHOLD=${THREAT_THRESHOLD:-70}
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODEL_PATH=/app/models
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_models:/app/models
    networks:
      - chainguard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g

  alert-service:
    build:
      context: ./services/alert-service
      dockerfile: Dockerfile
    container_name: chainguard-alert-service
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://chainguard:chainguard_password@mongodb:27017/chainguard}
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - ALERT_EMAIL_RECIPIENTS=${ALERT_EMAIL_RECIPIENTS}
      - SMS_RECIPIENTS=${SMS_RECIPIENTS}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chainguard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m

  api-server:
    build:
      context: ./services/api-server
      dockerfile: Dockerfile
    container_name: chainguard-api-server
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://chainguard:chainguard_password@mongodb:27017/chainguard}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AI_ENGINE_URL=http://ai-engine:8000
      - ALERT_SERVICE_URL=http://alert-service:3001
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    networks:
      - chainguard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m

  # ─── Production Proxy (profile: production) ───────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: chainguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-server
      - ai-engine
    networks:
      - chainguard
    restart: unless-stopped
    profiles:
      - production

  # ─── Monitoring (profile: monitoring) ─────────────────────────────────────

  mongo-express:
    image: mongo-express:latest
    container_name: chainguard-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-chainguard}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-chainguard_password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-chainguard}:${MONGO_ROOT_PASSWORD:-chainguard_password}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - chainguard
    restart: unless-stopped
    profiles:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: chainguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - chainguard
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:latest
    container_name: chainguard-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - chainguard
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256m

# ─── Volumes ────────────────────────────────────────────────────────────────

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  ai_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ─── Networks ───────────────────────────────────────────────────────────────

networks:
  chainguard:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
